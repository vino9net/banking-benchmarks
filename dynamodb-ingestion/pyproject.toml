[project]
name = "dynamodb-ingestion-bench"
version = "0.1.0"
description = "DynamoDB ingestion TPS/delay reporter for the banking-benchmarks rig"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
]

[dependency-groups]
dev = [
    "ruff>=0.15.21",
]

# Two standalone scripts (core_sim_tps.py, ddb_ingestion_metrics.py), not an importable
# package — no build-system/src layout needed. `uv sync` still creates a venv with
# boto3 installed and runnable via `uv run python <script>.py`.
[tool.uv]
package = false

# Matches the ruff config in ../../core-sim, ../../account-inquiry, and
# ~/Projects/git/edgar/fund_researcher's pyproject.toml, so `uv run ruff check .` behaves
# the same way in every repo in this workspace.
[tool.ruff]
line-length = 92
indent-width = 4
exclude = [".git", "__pycache__", "venv", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "C", "I", "A", "B", "S", "UP"]
ignore = ["E203", "E266", "S101"]

[tool.ruff.lint.mccabe]
max-complexity = 15
